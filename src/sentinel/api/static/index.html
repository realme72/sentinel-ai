<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Sentinel-AI</title>
<style>
/* ---------------------------------------------------------------------------
   Palette: the validated reference instance.
   Risk bands use the STATUS slots, not categorical ones -- a band is a state,
   not a series -- and every band chip carries its text label, because a status
   colour must never be the only channel.
   --------------------------------------------------------------------------- */
:root {
  color-scheme: light;
  --plane:      #f9f9f7;
  --surface:    #fcfcfb;
  --ink:        #0b0b0b;
  --ink-2:      #52514e;
  --ink-muted:  #898781;
  --grid:       #e1e0d9;
  --axis:       #c3c2b7;
  --hairline:   rgba(11,11,11,0.10);
  --wash:       rgba(11,11,11,0.035);

  --critical:   #d03b3b;
  --serious:    #ec835a;
  --warning:    #fab219;
  --good:       #0ca30c;

  --blue:       #2a78d6;
  --blue-soft:  #86b6ef;
  --accent:     #2a78d6;
  --radius:     8px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    color-scheme: dark;
    --plane:     #0d0d0d;
    --surface:   #1a1a19;
    --ink:       #ffffff;
    --ink-2:     #c3c2b7;
    --ink-muted: #898781;
    --grid:      #2c2c2a;
    --axis:      #383835;
    --hairline:  rgba(255,255,255,0.10);
    --wash:      rgba(255,255,255,0.05);
    --blue:      #3987e5;
    --blue-soft: #1c5cab;
    --accent:    #3987e5;
  }
}
:root[data-theme="dark"] {
  color-scheme: dark;
  --plane: #0d0d0d; --surface: #1a1a19; --ink: #fff; --ink-2: #c3c2b7;
  --ink-muted: #898781; --grid: #2c2c2a; --axis: #383835;
  --hairline: rgba(255,255,255,0.10); --wash: rgba(255,255,255,0.05);
  --blue: #3987e5; --blue-soft: #1c5cab; --accent: #3987e5;
}

* { box-sizing: border-box; }
html, body { margin: 0; }
body {
  background: var(--plane); color: var(--ink);
  font: 14px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif;
  -webkit-font-smoothing: antialiased;
}
[hidden] { display: none !important; }
a { color: var(--accent); text-decoration: none; }
a:hover { text-decoration: underline; }

/* --- shell --------------------------------------------------------------- */
.shell { display: grid; grid-template-columns: 208px 1fr; min-height: 100vh; }
nav.side {
  border-right: 1px solid var(--hairline); padding: 20px 12px;
  display: flex; flex-direction: column; gap: 2px;
  position: sticky; top: 0; height: 100vh; overflow-y: auto;
}
.brand { padding: 0 10px 18px; }
.brand b { font-size: 15px; letter-spacing: -0.01em; }
.brand span { display: block; color: var(--ink-muted); font-size: 11.5px; margin-top: 2px; }
nav.side button {
  all: unset; cursor: pointer; padding: 7px 10px; border-radius: 6px;
  color: var(--ink-2); font-size: 13.5px;
}
nav.side button:hover { background: var(--wash); color: var(--ink); }
nav.side button[aria-current="page"] { background: var(--wash); color: var(--ink); font-weight: 600; }
.side-foot { margin-top: auto; padding: 12px 10px 0; border-top: 1px solid var(--hairline); }
.side-foot button {
  all: unset; cursor: pointer; color: var(--ink-muted); font-size: 12px; padding: 4px 0;
}
.side-foot button:hover { color: var(--ink); }

main { padding: 28px 32px 64px; max-width: 1180px; }
h1 { font-size: 20px; margin: 0 0 4px; letter-spacing: -0.015em; }
.sub { color: var(--ink-2); margin: 0 0 24px; font-size: 13.5px; max-width: 68ch; }
h2 { font-size: 14px; margin: 28px 0 12px; letter-spacing: -0.005em; }

/* --- surfaces ------------------------------------------------------------ */
.card {
  background: var(--surface); border: 1px solid var(--hairline);
  border-radius: var(--radius); padding: 16px;
}
.tiles { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 10px; }
.tile .label { color: var(--ink-muted); font-size: 11.5px; text-transform: uppercase; letter-spacing: 0.04em; }
.tile .value { font-size: 26px; margin-top: 6px; letter-spacing: -0.02em; }
.tile .note { color: var(--ink-2); font-size: 12px; margin-top: 2px; }
.grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
@media (max-width: 900px) {
  .shell { grid-template-columns: 1fr; }
  nav.side { position: static; height: auto; flex-direction: row; flex-wrap: wrap;
             border-right: 0; border-bottom: 1px solid var(--hairline); }
  .brand { width: 100%; padding-bottom: 8px; }
  .side-foot { margin: 0; border: 0; }
  .grid-2 { grid-template-columns: 1fr; }
  main { padding: 20px 16px 56px; }
}

/* --- band chips: colour + ALWAYS a label -------------------------------- */
.band { display: inline-flex; align-items: center; gap: 6px; font-size: 12px; white-space: nowrap; }
.band .dot { width: 8px; height: 8px; border-radius: 50%; flex: none; }
.band.critical .dot { background: var(--critical); }
.band.high     .dot { background: var(--serious); }
.band.medium   .dot { background: var(--warning); }
.band.low      .dot { background: var(--good); }
.pill {
  display: inline-block; padding: 1px 7px; border-radius: 999px; font-size: 11px;
  border: 1px solid var(--hairline); color: var(--ink-2); white-space: nowrap;
}
.pill.kev { color: var(--critical); border-color: var(--critical); }
.pill.ok  { color: var(--good); border-color: var(--good); }

/* --- tables -------------------------------------------------------------- */
table { width: 100%; border-collapse: collapse; font-size: 13px; }
thead th {
  text-align: left; font-weight: 600; font-size: 11.5px; color: var(--ink-muted);
  text-transform: uppercase; letter-spacing: 0.04em;
  padding: 0 10px 8px; border-bottom: 1px solid var(--hairline); white-space: nowrap;
}
tbody td { padding: 9px 10px; border-bottom: 1px solid var(--hairline); vertical-align: top; }
tbody tr:last-child td { border-bottom: 0; }
tbody tr.clickable { cursor: pointer; }
tbody tr.clickable:hover { background: var(--wash); }
.num { text-align: right; font-variant-numeric: tabular-nums; }
.mono { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 12px; }
.truncate { max-width: 260px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.scroll-x { overflow-x: auto; }

/* --- controls ------------------------------------------------------------ */
.filters { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin-bottom: 12px; }
select, input[type=text], input[type=search] {
  font: inherit; font-size: 13px; padding: 6px 9px; border-radius: 6px;
  border: 1px solid var(--hairline); background: var(--surface); color: var(--ink);
}
input[type=search] { min-width: 280px; }
.btn {
  all: unset; cursor: pointer; font-size: 13px; padding: 6px 12px; border-radius: 6px;
  border: 1px solid var(--hairline); background: var(--surface); color: var(--ink);
}
.btn:hover { background: var(--wash); }
.btn.primary { background: var(--accent); color: #fff; border-color: transparent; }
.btn.primary:hover { filter: brightness(1.08); }
.seg { display: inline-flex; border: 1px solid var(--hairline); border-radius: 6px; overflow: hidden; }
.seg button {
  all: unset; cursor: pointer; padding: 6px 11px; font-size: 12.5px; color: var(--ink-2);
}
.seg button[aria-pressed="true"] { background: var(--accent); color: #fff; }
label.inline { font-size: 12.5px; color: var(--ink-2); display: inline-flex; gap: 6px; align-items: center; }

/* --- charts -------------------------------------------------------------- */
.chart-title { font-size: 13px; font-weight: 600; }
.chart-note { color: var(--ink-muted); font-size: 11.5px; margin-top: 2px; }
svg.chart { display: block; width: 100%; height: auto; margin-top: 14px; overflow: visible; }
svg.chart text { font: 11px system-ui, sans-serif; fill: var(--ink-muted); }
svg.chart .val { fill: var(--ink-2); font-variant-numeric: tabular-nums; }
svg.chart .gridline { stroke: var(--grid); stroke-width: 1; }
svg.chart .baseline { stroke: var(--axis); stroke-width: 1; }
svg.chart .mark:hover { filter: brightness(1.12); }

/* --- drawer -------------------------------------------------------------- */
.drawer-back {
  position: fixed; inset: 0; background: rgba(0,0,0,0.28); z-index: 40;
}
.drawer {
  position: fixed; top: 0; right: 0; height: 100vh; width: min(620px, 100%);
  background: var(--surface); border-left: 1px solid var(--hairline);
  z-index: 41; overflow-y: auto; padding: 22px 24px 48px;
}
.drawer h3 { margin: 0 0 2px; font-size: 16px; }
.drawer .close { position: absolute; top: 16px; right: 18px; }
.kv { display: grid; grid-template-columns: 148px 1fr; gap: 6px 14px; font-size: 13px; margin: 14px 0; }
.kv dt { color: var(--ink-muted); }
.kv dd { margin: 0; }
pre.block {
  background: var(--plane); border: 1px solid var(--hairline); border-radius: 6px;
  padding: 12px; overflow-x: auto; font-size: 12px; line-height: 1.55;
  font-family: ui-monospace, SFMono-Regular, Menlo, monospace; white-space: pre-wrap;
}
.factor-row { display: grid; grid-template-columns: 92px 1fr 54px; gap: 10px; align-items: center; margin: 7px 0; }
.factor-bar { height: 7px; border-radius: 4px; background: var(--wash); overflow: hidden; }
.factor-bar i { display: block; height: 100%; border-radius: 4px; background: var(--blue); }

/* --- tutorial ------------------------------------------------------------ */
/* The highlight is an outline ON the target element, not a separately
   positioned overlay. An absolutely-positioned spotlight has to re-derive the
   element's box on every scroll and resize, races the layout, and -- in dark
   mode -- dims with black against an almost-black page, so it is invisible
   anyway. An outline needs no coordinates and cannot drift. */
.tut-focus {
  outline: 2px solid var(--accent); outline-offset: 5px;
  border-radius: 10px; scroll-margin: 120px;
}
.tut-card {
  position: fixed; z-index: 62; right: 24px; bottom: 24px;
  width: min(420px, calc(100vw - 32px));
  background: var(--surface); border: 1px solid var(--hairline);
  border-radius: 10px; padding: 18px 20px; box-shadow: 0 16px 48px rgba(0,0,0,0.38);
}
.tut-card .step { color: var(--ink-muted); font-size: 11.5px; letter-spacing: 0.04em; text-transform: uppercase; }
.tut-card h4 { margin: 6px 0 8px; font-size: 15.5px; }
.tut-card p { margin: 0 0 10px; font-size: 13.5px; color: var(--ink-2); }
.tut-card .evidence {
  background: var(--plane); border: 1px solid var(--hairline); border-radius: 6px;
  padding: 9px 11px; font-size: 12.5px; margin: 0 0 12px;
  font-family: ui-monospace, SFMono-Regular, Menlo, monospace; white-space: pre-wrap;
}
.tut-actions { display: flex; gap: 8px; align-items: center; }
.tut-actions .spacer { flex: 1; }
.banner {
  display: flex; gap: 12px; align-items: center; justify-content: space-between;
  background: var(--surface); border: 1px solid var(--hairline);
  border-left: 3px solid var(--accent);
  border-radius: var(--radius); padding: 13px 16px; margin-bottom: 22px;
}
.banner div p { margin: 2px 0 0; font-size: 12.5px; color: var(--ink-2); }
.empty { color: var(--ink-muted); font-size: 13px; padding: 20px 0; }
.err { color: var(--critical); font-size: 13px; }
.loading { color: var(--ink-muted); font-size: 13px; padding: 16px 0; }
details.help { margin: 10px 0; }
details.help summary { cursor: pointer; font-size: 13px; color: var(--ink-2); }
details.help div { padding: 10px 0 0; font-size: 13px; color: var(--ink-2); max-width: 72ch; }
.steps-list { counter-reset: s; list-style: none; padding: 0; max-width: 74ch; }
.steps-list li {
  counter-increment: s; position: relative; padding: 0 0 18px 34px; font-size: 13.5px; color: var(--ink-2);
}
.steps-list li::before {
  content: counter(s); position: absolute; left: 0; top: 0;
  width: 22px; height: 22px; border-radius: 50%; background: var(--wash);
  color: var(--ink); font-size: 11.5px; font-weight: 600;
  display: grid; place-items: center;
}
.steps-list b { color: var(--ink); }
code.inline {
  background: var(--wash); padding: 1px 5px; border-radius: 4px;
  font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 12px;
}
</style>
</head>
<body>
<div class="shell">
  <nav class="side">
    <div class="brand">
      <b>Sentinel-AI</b>
      <span>vulnerability triage</span>
    </div>
    <button data-view="overview" aria-current="page">Overview</button>
    <button data-view="triage">Triage queue</button>
    <button data-view="actions">Fix actions</button>
    <button data-view="search">Retrieval</button>
    <button data-view="teams">Teams</button>
    <button data-view="guide">Guide</button>
    <div class="side-foot">
      <button id="theme-toggle">Toggle theme</button><br>
      <button id="start-tour">Interactive tutorial</button><br>
      <a href="/docs" target="_blank" style="font-size:12px">API docs &nearr;</a>
    </div>
  </nav>
  <main>
    <div id="view-overview"></div>
    <div id="view-triage" hidden></div>
    <div id="view-actions" hidden></div>
    <div id="view-search" hidden></div>
    <div id="view-teams" hidden></div>
    <div id="view-guide" hidden></div>
  </main>
</div>
<div id="drawer-root"></div>
<div id="tour-root"></div>
<script src="/static/app.js"></script>
</body>
</html>
